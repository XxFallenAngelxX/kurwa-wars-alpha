name: Render Garage FM voice pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render-level-voice.py
      - .github/workflows/render-level-voice.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts==1.5.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/render-level-voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: garage-fm-voice
          path: assets/audio/voice/shouts-v2/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/voice/shouts-v2/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render short Russian level-up stingers"
          git push origin HEAD:main
