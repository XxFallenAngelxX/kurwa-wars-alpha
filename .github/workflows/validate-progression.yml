name: Validate progression patch
on:
  push:
    branches: ['main', 'fix/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import selected KURVFLICT branding
        if: github.ref == 'refs/heads/fix/kurvflict-branding'
        run: |
          test -f assets/branding/kurvflict-source.webp
          python -m pip install Pillow
          python scripts/import-branding.py
      - run: node scripts/test-activities.mjs
      - run: node scripts/test-virtual-players.mjs
      - run: node scripts/test-combat-stats.mjs
      - run: node scripts/test-dungeons.mjs
      - run: node scripts/test-codex-speed.mjs
      - run: node scripts/test-chat-dock.mjs
      - run: npm run test:offline-audio
      - run: npm run test:update
      - run: npm run build
      - run: npm run check
      - name: Commit generated build on current branch
        run: |
          git add generated/engine-template.js generated/sw-version.js
          if [ "$GITHUB_REF_NAME" = 'fix/kurvflict-branding' ]; then
            git add assets/branding/kurvflict-loading.webp assets/raw/images/7f9218e42db9bb1204b1.webp assets/icons/icon-192.png assets/icons/icon-512.png assets/packs/assets-2.js src/host/asset-loader.js
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build validated progression patch"
          git push origin "HEAD:$GITHUB_REF_NAME"
